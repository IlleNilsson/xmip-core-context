# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-context"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-context"
description = "Typed message context values for Xmip."

[dependencies]
# PartyId, and the Mechanism a gate concluded against. Direction is
# context -> party -> core, and party depends on neither of these.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The identity facts' one binary form (`facts_record`): a
# `codec::form::Form`, written and read over the estate's one byte writer and
# cursor.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# `Required`, the weakest verdict a Location takes, read from configuration
# in the words `Verified` writes.
serde = { version = "1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3
